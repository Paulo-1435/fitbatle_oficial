<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBattle - Perfil</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="ranking.css">
  <link rel="stylesheet" href="perfil-publico.css">
  <script src="config.js" defer></script>
  <script src="api.js" defer></script>
  <script src="shell.js" defer></script>
  <script src="perfil-publico.js" defer></script>
</head>
<body data-pagina="perfil-publico">
<main>

  <a class="link-voltar" href="busca.html">&larr; Voltar para a busca</a>

  <section class="card" id="cartaoPerfilPublico" hidden>
    <div class="perfil-publico-cabecalho">
      <span class="avatar avatar--grande" id="avatarPublico" aria-hidden="true"></span>
      <div>
        <h1 id="nomePublico">Carregando...</h1>
        <span class="rotulo-mini" id="cidadePublica"></span>
      </div>
    </div>
    <dl class="perfil-publico-stats">
      <div><dt>Nível</dt><dd id="nivelPublico">—</dd></div>
      <div><dt>XP</dt><dd id="xpPublico">—</dd></div>
      <div><dt>Posição Global</dt><dd id="posicaoGlobalPublica">—</dd></div>
      <div><dt>Posição Regional</dt><dd id="posicaoRegionalPublica">—</dd></div>
    </dl>
    <p id="descricaoPublica"></p>
  </section>

  <section class="card" id="cartaoNaoEncontrado" hidden>
    <p class="estado-vazio">Perfil não encontrado.</p>
  </section>

</main>
</body>
</html>
